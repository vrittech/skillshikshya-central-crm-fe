name: CI/CD

# Pull request to main: lint and build.
# Push to main (or "Run workflow"): lint and build, build the image, push it to
# GitHub Container Registry (ghcr.io/vrittech/skillshikshya-crm-frontend), then
# pull and restart it on the server over SSH.
#
# Repository secrets are listed in DEPLOY.md. A secret left as CHANGE_ME counts as
# not set: required ones stop the deploy with their names, optional ones are skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/skillshikshya-crm-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check and build
        run: npm run build

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and write the server .env
        id: settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
        run: |
          is_set() { [ -n "$1" ] && [ "$1" != "CHANGE_ME" ]; }

          missing=""
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do is_set "${!name}" || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::Set these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

          umask 077
          {
            printf "FRONTEND_IMAGE='%s'\n" "$IMAGE:$GITHUB_SHA"
            if is_set "$FRONTEND_PORT"; then printf "FRONTEND_PORT='%s'\n" "$FRONTEND_PORT"; fi
          } > server.env
          # The copy step runs in its own container as another user, so it must be able to
          # read the file. The runner is thrown away after the job; on the server the
          # file becomes .env with mode 600.
          chmod 644 server.env

          if is_set "$DEPLOY_PATH"; then path="$DEPLOY_PATH"; else path="~/skillshikshya-crm-frontend"; fi
          if is_set "$SSH_PORT"; then port="$SSH_PORT"; else port=22; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Copy the compose file and .env to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ steps.settings.outputs.port }}
          source: docker-compose.prod.yml,server.env
          target: ${{ steps.settings.outputs.path }}

      - name: Pull the image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ steps.settings.outputs.port }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ${{ steps.settings.outputs.path }}
            docker compose version > /dev/null || { echo "Install Docker with the compose plugin on the server"; exit 1; }
            install -m 600 server.env .env && rm -f server.env
            docker network inspect skillshikshya > /dev/null 2>&1 || docker network create skillshikshya
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker logout ghcr.io
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            up=""
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml exec -T web wget -q -O /dev/null http://localhost/ 2> /dev/null; then
                up=1; break
              fi
              sleep 5
            done
            if [ -z "$up" ]; then
              echo "The site did not start (deploy the backend first: nginx needs http://backend:8188). Last log lines:"
              docker compose -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            fi
            echo "Site is up"
            docker image prune -f
